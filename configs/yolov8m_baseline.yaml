# YOLOv8-m Baseline Model
# Standard Ultralytics YOLOv8 medium-scale architecture
# https://docs.ultralytics.com/models/yolov8

# PARAMETERS
nc: 48
depth_multiple: 0.67
width_multiple: 0.75
max_channels: 768

# BACKBONE
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]       # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]      # 1-P2/4
  - [-1, 3, C2f, [128, True]]       # 2

  - [-1, 1, Conv, [256, 3, 2]]      # 3-P3/8
  - [-1, 6, C2f, [256, True]]       # 4

  - [-1, 1, Conv, [512, 3, 2]]      # 5-P4/16
  - [-1, 6, C2f, [512, True]]       # 6

  - [-1, 1, Conv, [768, 3, 2]]      # 7-P5/32
  - [-1, 3, C2f, [768, True]]       # 8

  - [-1, 1, SPPF, [768, 5]]         # 9

# HEAD
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 10
  - [[-1, 6], 1, Concat, [1]]                     # 11
  - [-1, 3, C2f, [512]]                           # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 13
  - [[-1, 4], 1, Concat, [1]]                     # 14
  - [-1, 3, C2f, [256]]                           # 15 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                    # 16
  - [[-1, 12], 1, Concat, [1]]                    # 17
  - [-1, 3, C2f, [512]]                           # 18 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                    # 19
  - [[-1, 9], 1, Concat, [1]]                     # 20
  - [-1, 3, C2f, [768]]                           # 21 (P5/32-large)

  - [[15, 18, 21], 1, Detect, [nc]]               # Detect(P3, P4, P5)
