# YOLO11-m Enhanced Architecture
# Hardcoded channel sizes matching official YOLO11-m output
# (equivalent to depth=0.50, width=1.00, max_ch=512 applied)
# No depth/width/max_channels lines — avoids ultralytics scale parsing bug

# PARAMETERS
nc: 48

# BACKBONE (channel sizes match official YOLO11-m exactly + enhancement)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]              # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]             # 1-P2/4
  - [-1, 1, C3k2, [256, True, 0.25]]       # 2

  - [-1, 1, Conv, [256, 3, 2]]             # 3-P3/8
  - [-1, 1, C3k2, [512, True, 0.25]]       # 4

  - [-1, 1, Conv, [512, 3, 2]]             # 5-P4/16
  - [-1, 1, C3k2, [512, True]]             # 6

  - [-1, 1, Conv, [512, 3, 2]]             # 7-P5/32
  - [-1, 1, C3k2, [512, True]]             # 8

  # --- ENHANCEMENT: Extra Conv + C3k2 block ---
  - [-1, 1, Conv, [512, 3, 1]]             # 9  (added Conv, stride=1)
  - [-1, 1, C3k2, [512, True]]             # 10 (added C3k2)

  - [-1, 1, SPPF, [512, 5]]               # 11
  - [-1, 1, C2PSA, [512]]                  # 12

# HEAD
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 13
  - [[-1, 6], 1, Concat, [1]]                     # 14
  - [-1, 1, C3k2, [512, True]]                    # 15

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 16
  - [[-1, 4], 1, Concat, [1]]                     # 17
  - [-1, 1, C3k2, [256, True]]                    # 18 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                    # 19
  - [[-1, 15], 1, Concat, [1]]                    # 20
  - [-1, 1, C3k2, [512, True]]                    # 21 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                    # 22
  - [[-1, 12], 1, Concat, [1]]                    # 23
  - [-1, 1, C3k2, [512, True]]                    # 24 (P5/32-large)

  - [[18, 21, 24], 1, Detect, [nc]]               # Detect(P3, P4, P5)
