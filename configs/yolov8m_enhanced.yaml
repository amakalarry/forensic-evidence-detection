# YOLOv8-m Enhanced Architecture
# Medium-scale with added C2f + Conv blocks for deeper feature extraction
# CRITICAL: depth/width multipliers MUST match baseline medium scale

# PARAMETERS
nc: 48
depth_multiple: 0.67
width_multiple: 0.75
max_channels: 768

# BACKBONE
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]       # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]      # 1-P2/4
  - [-1, 3, C2f, [128, True]]       # 2

  - [-1, 1, Conv, [256, 3, 2]]      # 3-P3/8
  - [-1, 6, C2f, [256, True]]       # 4

  - [-1, 1, Conv, [512, 3, 2]]      # 5-P4/16
  - [-1, 6, C2f, [512, True]]       # 6

  - [-1, 1, Conv, [768, 3, 2]]      # 7-P5/32
  - [-1, 3, C2f, [768, True]]       # 8

  # --- ENHANCEMENT: Extra Conv + C2f block ---
  - [-1, 1, Conv, [768, 3, 1]]      # 9  (added Conv, stride=1)
  - [-1, 3, C2f, [768, True]]       # 10 (added C2f for deeper features)

  - [-1, 1, SPPF, [768, 5]]         # 11

# HEAD
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 12
  - [[-1, 6], 1, Concat, [1]]                     # 13
  - [-1, 3, C2f, [512]]                           # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 15
  - [[-1, 4], 1, Concat, [1]]                     # 16
  - [-1, 3, C2f, [256]]                           # 17 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                    # 18
  - [[-1, 14], 1, Concat, [1]]                    # 19
  - [-1, 3, C2f, [512]]                           # 20 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                    # 21
  - [[-1, 11], 1, Concat, [1]]                    # 22
  - [-1, 3, C2f, [768]]                           # 23 (P5/32-large)

  - [[17, 20, 23], 1, Detect, [nc]]               # Detect(P3, P4, P5)
